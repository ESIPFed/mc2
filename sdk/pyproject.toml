[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mapcontrol"
version = "0.3.0"
description = "Python client SDK for the MapControl live-map server (sessions, assets, GeoTIFFs, screenshots, themes)"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Otto Wagner" },
]
requires-python = ">=3.11"
keywords = ["map", "gis", "maplibre", "geotiff", "visualization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["mapcontrol"]
