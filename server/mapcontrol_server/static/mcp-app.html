<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ESIP Map</title>
<!--
  ESIP MCP-App template v1 — Option B: NATIVE MapLibre map in the app view.

  Probe-8 verdict (2026-07-18, Claude web): the Apps sandbox honors
  connectDomains (fetch to our origin resolved) and the resource channel
  (img error was a plain 404, not a CSP violation), but NOT frameDomains
  (explicit frame-src violation). So instead of nesting the live /map page
  in an iframe (Option A — still works on hosts that honor frameDomains),
  this template renders the map itself:

    1. ext-apps handshake (hand-rolled, ~probe-6): the APP sends
       ui/initialize to window.parent, awaits the result, sends
       initialized + size-changed. No SDK bundle — a 342KB inline bundle
       broke template delivery outright (probes 1-3).
    2. On tool-result: extract map_id + url -> derive the ESIP origin.
    3. Load MapLibre GL JS/CSS from {origin}/static/vendor/ (resource
       channel; self-hosted so one origin covers everything).
    4. POST /api/maps/{id}/sessions -> user_session_id, then open
       wss://{origin}/ws/{map_id}/{session} and send session_restore ->
       session_snapshot carries assets + viewport + basemap (connect
       channel covers both fetch and WebSocket).
    5. Render: raster basemap + GeoJSON assets; apply viewport.
    6. Any further WS broadcast (zoom, add_geojson, set_basemap, ... from
       MCP tools) triggers a debounced session_restore -> live re-render.

  Graceful degradation: if MapLibre fails to load or the WS/API is
  unreachable, the status line shows the error and the map URL remains in
  the tool result for opening in a browser.
-->
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0b1220; }
  #wrap { position: relative; width: 100%; height: 480px; }
  #map { position: absolute; inset: 0; }
  #status {
    position: absolute; top: 0; left: 0; right: 0; z-index: 20;
    background: rgba(11, 18, 32, 0.92); color: #9fb3d1;
    font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    padding: 6px 10px; white-space: pre-wrap; word-break: break-all;
  }
  #status.hidden { display: none; }
</style>
</head>
<body>
  <div id="wrap">
    <div id="map"></div>
    <div id="status">ESIP map: waiting for MCP host…</div>
  </div>
  <script>
    "use strict";
    var statusEl = document.getElementById("status");
    function setStatus(text) {
      statusEl.textContent = text;
      statusEl.classList.remove("hidden");
    }
    function hideStatus() { statusEl.classList.add("hidden"); }

    // Basemap definitions mirroring the server's config defaults
    // (config.py _default_basemaps). The session snapshot names the active
    // basemap by key; unknown keys fall back to osm.
    var BASEMAPS = {
      osm: {
        tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
        attribution: "\u00a9 OpenStreetMap contributors"
      },
      satellite: {
        tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],
        attribution: "\u00a9 Esri"
      }
    };

    // ── ext-apps handshake (app initiates; see probe 6) ────────────────────
    var initDone = false, pendingInitId = null, attempts = 0;
    var toolResultSeen = false;

    function post(m) { window.parent.postMessage(m, "*"); }

    function sendSize() {
      post({ jsonrpc: "2.0", method: "ui/notifications/size-changed",
             params: { width: Math.ceil(window.innerWidth) || 800, height: 480 } });
    }

    function tryInit() {
      if (initDone || attempts >= 10) return;
      attempts++;
      pendingInitId = "init-" + attempts;
      post({
        jsonrpc: "2.0", id: pendingInitId, method: "ui/initialize",
        params: {
          appInfo: { name: "ESIP Map", version: "1.0.0" },
          appCapabilities: {},
          protocolVersion: "2026-01-26"
        }
      });
      setTimeout(tryInit, 700);
    }

    function findUrl(obj) {
      if (!obj || typeof obj !== "object") return null;
      if (typeof obj.url === "string" && obj.url.indexOf("http") === 0) return obj.url;
      for (var k in obj) { var v = findUrl(obj[k]); if (v) return v; }
      return null;
    }

    window.addEventListener("message", function (ev) {
      var d = ev.data;
      if (!d || typeof d !== "object" || d.jsonrpc !== "2.0") return;
      if (d.id !== undefined && (d.result !== undefined || d.error !== undefined)) {
        if (!initDone && d.id === pendingInitId && !d.error) {
          initDone = true;
          post({ jsonrpc: "2.0", method: "ui/notifications/initialized" });
          sendSize();
          setStatus("ESIP map: connected \u2014 waiting for map\u2026");
        }
        return;
      }
      if (d.method) {
        if (d.id !== undefined) post({ jsonrpc: "2.0", id: d.id, result: {} });
        if (d.method === "ui/notifications/tool-result" && !toolResultSeen) {
          var url = findUrl(d.params);
          if (url) {
            toolResultSeen = true;
            bootMap(url);
          }
        }
      }
    });

    // ── Option B map boot ───────────────────────────────────────────────────
    var ORIGIN = null, MAP_ID = null, map = null, ws = null;
    var refreshTimer = null;

    function bootMap(mapUrl) {
      try {
        var u = new URL(mapUrl);
        ORIGIN = u.origin;
        var parts = u.pathname.split("/").filter(Boolean); // ["map", "<id>"]
        MAP_ID = parts[parts.length - 1];
      } catch (e) {
        setStatus("ESIP map: bad map url " + mapUrl);
        return;
      }
      setStatus("ESIP map: loading MapLibre\u2026");

      var css = document.createElement("link");
      css.rel = "stylesheet";
      css.href = ORIGIN + "/static/vendor/maplibre-gl.css";
      document.head.appendChild(css);

      var js = document.createElement("script");
      js.src = ORIGIN + "/static/vendor/maplibre-gl.js";
      js.onload = startSession;
      js.onerror = function () {
        setStatus("ESIP map: failed to load MapLibre from " + ORIGIN +
                  " \u2014 open the map in a browser instead: " + mapUrl);
      };
      document.head.appendChild(js);
    }

    function startSession() {
      // Show the world basemap immediately — data arrives asynchronously.
      renderSnapshot({ basemap: "osm" });
      fetch(ORIGIN + "/api/maps/" + MAP_ID + "/sessions", { method: "POST" })
        .then(function (r) {
          if (!r.ok) throw new Error("session create HTTP " + r.status);
          return r.json();
        })
        .then(function (s) {
          SESSION_ID = s.user_session_id;
          openWs(s.user_session_id);
        })
        .catch(function (e) {
          setStatus("ESIP map: session failed (" + e.message + ")");
          startPolling(); // still try REST-only rendering
        });
    }

    var SESSION_ID = null, pollTimer = null, wsHealthy = false;

    function openWs(sessionId) {
      var wsUrl = ORIGIN.replace(/^http/, "ws") + "/ws/" + MAP_ID + "/" + sessionId;
      try {
        ws = new WebSocket(wsUrl);
      } catch (e) {
        startPolling();
        return;
      }
      ws.onopen = function () {
        wsHealthy = true;
        stopPolling();
        ws.send(JSON.stringify({ type: "session_restore" }));
      };
      ws.onmessage = function (ev) {
        var msg;
        try { msg = JSON.parse(ev.data); } catch (e) { return; }
        if (msg.type === "session_snapshot") {
          renderSnapshot(msg.data || {});
        } else if (msg.type !== "take_screenshot") {
          // Any tool-driven broadcast (zoom, add_geojson, set_basemap, ...)
          // -> refresh full state (debounced; coarse but always correct).
          clearTimeout(refreshTimer);
          refreshTimer = setTimeout(function () {
            if (ws && ws.readyState === 1) {
              ws.send(JSON.stringify({ type: "session_restore" }));
            }
          }, 250);
        }
      };
      // WS blocked (e.g. a sandbox whose connect-src lacks wss:) or dropped:
      // fall back to REST polling so the map still works and follows tools.
      ws.onerror = function () { if (!wsHealthy) startPolling(); };
      ws.onclose = function () { if (!wsHealthy) startPolling(); };
    }

    function restSnapshot() {
      var assetsP = fetch(ORIGIN + "/api/maps/" + MAP_ID + "/assets")
        .then(function (r) { return r.ok ? r.json() : []; })
        .catch(function () { return []; });
      var vpP = SESSION_ID
        ? fetch(ORIGIN + "/api/maps/" + MAP_ID + "/sessions/" + SESSION_ID + "/viewport")
            .then(function (r) { return r.ok ? r.json() : {}; })
            .catch(function () { return {}; })
        : Promise.resolve({});
      return Promise.all([assetsP, vpP]).then(function (rv) {
        return { assets: rv[0] || [], viewport: (rv[1] || {}).viewport,
                 basemap: (rv[1] || {}).basemap || "osm" };
      });
    }

    function startPolling() {
      if (pollTimer) return;
      var tick = function () {
        restSnapshot().then(function (snap) { renderSnapshot(snap); });
      };
      tick();
      pollTimer = setInterval(tick, 3000);
    }

    function stopPolling() {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    }


    function basemapStyle(key) {
      var bm = BASEMAPS[key] || BASEMAPS.osm;
      return {
        version: 8,
        sources: { base: { type: "raster", tiles: bm.tiles, tileSize: 256,
                           attribution: bm.attribution } },
        layers: [{ id: "base", type: "raster", source: "base" }]
      };
    }

    var currentBasemap = null;

    function renderSnapshot(snap) {
      var basemap = snap.basemap || "osm";
      if (!map) {
        map = new maplibregl.Map({
          container: "map",
          style: basemapStyle(basemap),
          center: [0, 20], zoom: 1.5,
          attributionControl: { compact: true }
        });
        currentBasemap = basemap;
        map.addControl(new maplibregl.NavigationControl({ showCompass: false }));
        map.on("load", function () { applySnapshot(snap); hideStatus(); });
      } else {
        if (basemap !== currentBasemap) {
          currentBasemap = basemap;
          map.setStyle(basemapStyle(basemap));
          map.once("styledata", function () { applySnapshot(snap); });
        } else {
          applySnapshot(snap);
        }
      }
    }

    var assetLayerIds = [];

    function applySnapshot(snap) {
      // Clear previous asset layers/sources (full re-render on refresh).
      assetLayerIds.forEach(function (id) {
        if (map.getLayer(id)) map.removeLayer(id);
      });
      assetLayerIds = [];
      (snap.assets || []).forEach(function (a) {
        var srcId = "asset-" + a.asset_id;
        if (map.getSource(srcId)) map.removeSource(srcId);
      });

      (snap.assets || []).forEach(function (a) {
        if (a.visible === false) return;
        var gj = a.geojson;
        if (typeof gj === "string") {
          try { gj = JSON.parse(gj); } catch (e) { return; }
        }
        if (!gj || typeof gj !== "object") return;
        var srcId = "asset-" + a.asset_id;
        try {
          map.addSource(srcId, { type: "geojson", data: gj });
        } catch (e) { return; }
        var color = (a.style && (a.style.color || a.style.fill_color)) || "#38bdf8";
        var fillId = srcId + "-fill", lineId = srcId + "-line", ptId = srcId + "-pt";
        map.addLayer({ id: fillId, type: "fill", source: srcId,
          filter: ["==", ["geometry-type"], "Polygon"],
          paint: { "fill-color": color, "fill-opacity": 0.3 } });
        map.addLayer({ id: lineId, type: "line", source: srcId,
          paint: { "line-color": color, "line-width": 2 } });
        map.addLayer({ id: ptId, type: "circle", source: srcId,
          filter: ["==", ["geometry-type"], "Point"],
          paint: { "circle-color": color, "circle-radius": 5,
                   "circle-stroke-color": "#ffffff", "circle-stroke-width": 1 } });
        assetLayerIds.push(fillId, lineId, ptId);
      });

      var vp = snap.viewport || {};
      if (vp.bbox && vp.bbox.length === 4) {
        map.fitBounds([[vp.bbox[0], vp.bbox[1]], [vp.bbox[2], vp.bbox[3]]],
                      { padding: 24, duration: 400 });
      } else if (vp.center && vp.center.length === 2) {
        map.easeTo({ center: vp.center, zoom: (vp.zoom != null ? vp.zoom : 10),
                     pitch: vp.pitch || 0, bearing: vp.bearing || 0,
                     duration: 400 });
      }
    }

    tryInit();
  </script>
</body>
</html>
